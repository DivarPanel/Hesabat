<div id="invoiceDetailModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 space-y-4">
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h3 id="detailInvNo" class="text-sm font-bold text-slate-900">INV-000000</h3>
        <p id="detailDate" class="text-[10px] text-slate-500">-</p>
      </div>
      <button onclick="closeModal('invoiceDetailModal')" class="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
    </div>
    <div class="bg-slate-50 p-3 rounded-xl space-y-1.5 text-xs border">
      <div class="flex justify-between"><span class="text-slate-500">Müştəri:</span> <span id="detailCust" class="font-bold">-</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Satıcı:</span> <span id="detailUser" class="font-bold">-</span></div>
    </div>
    <div class="max-h-48 overflow-y-auto border-t border-b py-2">
      <table class="w-full text-left text-xs">
        <thead class="text-slate-400 text-[10px]">
          <tr>
            <th>Məhsul</th>
            <th class="text-center">Miqdar</th>
            <th class="text-right">Qiymət</th>
            <th class="text-right">Yekun</th>
          </tr>
        </thead>
        <tbody id="detailItemsTable"></tbody>
      </table>
    </div>
    <div class="flex justify-between items-center font-bold text-sm text-slate-900 pt-1">
      <span>Yekun Məbləğ:</span> <span id="detailTotal" class="text-blue-600 text-base">0.00 ₼</span>
    </div>
    <div class="flex gap-2 pt-2">
      <button onclick="saveInvoiceChanges()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs">Yadda Saxla</button>
      <button onclick="closeModal('invoiceDetailModal')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-xl text-xs">Bağla</button>
    </div>
  </div>
</div>
