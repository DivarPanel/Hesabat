<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>DecorConcept POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    *{box-sizing:border-box} body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}
    .scrollbar::-webkit-scrollbar{width:6px;height:6px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
    .nav-active{background:#eaf2ff;color:#2563eb}.modal{background:rgba(15,23,42,.48);backdrop-filter:blur(5px)}
    .suggestions{max-height:280px;overflow:auto}.kbd{font-size:10px;padding:2px 6px;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;background:white;color:#64748b}
    input,select,textarea{outline:none}.focus-ring:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}

<body class="h-screen overflow-hidden">
<div id="toast" class="fixed top-4 right-4 z-[100] hidden"></div>

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-7">
    <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white grid place-items-center text-xl font-black mx-auto">DC</div>
    <h1 class="text-xl font-black text-center mt-4">DecorConcept POS</h1>
    <p class="text-xs text-slate-500 text-center mt-1">Eurohome Filialı</p>
    <div class="mt-7">
      <label class="text-xs font-bold text-slate-600">PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autofocus class="focus-ring mt-2 w-full rounded-2xl border border-slate-200 px-4 py-4 text-center text-2xl tracking-[.5em] font-black" placeholder="••••">
      <button id="loginBtn" onclick="login()" class="mt-3 w-full rounded-2xl bg-blue-600 hover:bg-blue-700 text-white py-3.5 font-bold">Daxil ol <span class="kbd ml-2">Enter</span></button>
      <p id="loginError" class="hidden text-center text-xs text-rose-600 mt-3"></p>
    </div>
    <p class="text-[10px] text-slate-400 text-center mt-6">PIN-lər frontend-də saxlanmır. İstifadəçilər Google Sheets-dən idarə olunur.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden h-full">
  <div class="h-full flex">
    <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col">
      <div class="p-5 border-b"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-blue-600 text-white grid place-items-center font-black">DC</div><div><b>DecorConcept</b><p class="text-[10px] text-slate-400">Professional POS</p></div></div></div>
      <nav class="p-3 space-y-1 flex-1">
        <button class="nav w-full text-left px-4 py-3 rounded-xl text-sm font-bold nav-active" data-view="dashboard"><i class="fa-solid fa-chart-line w-5"></i> Dashboard</button>
        <button class="nav w-full text-left px-4 py-3 rounded-xl text-sm font-bold" data-view="pos"><i class="fa-solid fa-cash-register w-5"></i> Satış / POS</button>
        <button class="nav w-full text-left px-4 py-3 rounded-xl text-sm font-bold" data-view="products"><i class="fa-solid fa-boxes-stacked w-5"></i> Məhsullar</button>
        <button class="nav w-full text-left px-4 py-3 rounded-xl text-sm font-bold" data-view="customers"><i class="fa-solid fa-users w-5"></i> Müştərilər</button>
        <button class="nav w-full text-left px-4 py-3 rounded-xl text-sm font-bold" data-view="reports"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Əməliyyatlar</button>
      </nav>
      <div class="p-4 border-t"><div class="flex items-center justify-between"><div><b id="userName" class="text-sm">-</b><p id="userRole" class="text-[10px] text-slate-400">-</p></div><button onclick="logout()" class="text-rose-500"><i class="fa-solid fa-right-from-bracket"></i></button></div></div>
    </aside>
    <main class="flex-1 min-w-0 flex flex-col">
      <header class="h-16 bg-white border-b flex items-center justify-between px-4 md:px-6"><div><h2 id="pageTitle" class="font-black">Dashboard</h2><p id="serverClock" class="text-[10px] text-slate-400">Server: -</p></div><div class="flex gap-2"><button onclick="refreshData()" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold"><i class="fa-solid fa-rotate"></i></button><button onclick="logout()" class="md:hidden px-3 py-2 rounded-xl bg-rose-50 text-rose-600 text-xs font-bold">Çıxış</button></div></header>
      <div id="content" class="flex-1 overflow-auto scrollbar p-4 md:p-6"></div>
    </main>
  </div>
</div>
