<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurohome - Gün Sonu və Əməliyyat Paneli</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <!-- Header / Başlıq -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-store text-2xl text-blue-400"></i>
        <h1 class="text-xl font-bold tracking-wide">Eurohome — İdarəetmə Paneli</h1>
      </div>
      <button onclick="fetchSheetData()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-2">
        <i class="fa-solid fa-rotate"></i>
        <span>Yenilə</span>
      </button>
    </div>
  </header>

  <!-- Əsas Konteynir -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- KPI / Gün Sonu Statistikaları -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span class="text-sm font-medium">Nağd Satış</span>
          <i class="fa-solid fa-money-bill-wave text-green-400"></i>
        </div>
        <div id="stat-cash" class="text-2xl font-bold text-slate-100">0.00 AZN</div>
      </div>

      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span class="text-sm font-medium">Kart Satışı</span>
          <i class="fa-solid fa-credit-card text-blue-400"></i>
        </div>
        <div id="stat-card" class="text-2xl font-bold text-slate-100">0.00 AZN</div>
      </div>

      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm">
        <div class="flex justify-between items-center text-slate-400 mb-2">
          <span class="text-sm font-medium">Xərclər (Rasxod)</span>
          <i class="fa-solid fa-receipt text-red-400"></i>
        </div>
        <div id="stat-expense" class="text-2xl font-bold text-red-400">0.00 AZN</div>
      </div>

      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm bg-gradient-to-br from-slate-800 to-slate-700">
        <div class="flex justify-between items-center text-slate-300 mb-2">
          <span class="text-sm font-semibold">Xalis Gün Sonu Kassası</span>
          <i class="fa-solid fa-vault text-yellow-400"></i>
        </div>
        <div id="stat-total" class="text-2xl font-extrabold text-yellow-400">0.00 AZN</div>
      </div>
    </div>

    <!-- Əməliyyatlar Cədvəli -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="text-lg font-bold flex items-center space-x-2">
          <i class="fa-solid fa-list-check text-blue-400"></i>
          <span>Son Əməliyyatlar Siyahısı</span>
        </h2>
        <span id="record-count" class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full">0 əməliyyat</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs border-b border-slate-700">
            <tr>
              <th class="py-3 px-4">Tarix / ID</th>
              <th class="py-3 px-4">Müştəri / Qeyd</th>
              <th class="py-3 px-4">Məhsul / Növ</th>
              <th class="py-3 px-4">Ədəd</th>
              <th class="py-3 px-4">Qiymət</th>
              <th class="py-3 px-4">Ödəniş Tipi</th>
              <th class="py-3 px-4">Cəmi AZN</th>
            </tr>
          </thead>
          <tbody id="transactions-body" class="divide-y divide-slate-700/50">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-500">Məlumatlar yüklənir...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Yeni Yenilənmiş Apps Script URL-iniz:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwILVdzjQB7aCaThLCgXLmO1DeVKSHmNlYdby2g5yd9hehHkJZPgk-PsH_KORhImmXmbg/exec";

    async function fetchSheetData() {
      const tbody = document.getElementById("transactions-body");
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin me-2"></i>Məlumatlar oxunur...</td></tr>`;

      try {
        const res = await fetch(SCRIPT_URL, { redirect: "follow" });
        if(!res.ok) {
          throw new Error(`Server cavabı mənfidir: ${res.status}`);
        }
        
        const data = await res.json();

        if (data.error) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-400">Google Script Xətası: ${data.error}</td></tr>`;
          return;
        }

        // Statistikalar
        document.getElementById("stat-cash").innerText = (data.summary.cash || 0).toFixed(2) + " AZN";
        document.getElementById("stat-card").innerText = (data.summary.card || 0).toFixed(2) + " AZN";
        document.getElementById("stat-expense").innerText = (data.summary.expense || 0).toFixed(2) + " AZN";
        document.getElementById("stat-total").innerText = (data.summary.netTotal || 0).toFixed(2) + " AZN";

        // Cədvəl
        document.getElementById("record-count").innerText = `${data.transactions.length} əməliyyat`;
        tbody.innerHTML = "";

        if(!data.transactions || data.transactions.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-500">Heç bir əməliyyat tapılmadı.</td></tr>`;
          return;
        }

        data.transactions.forEach(item => {
          const row = document.createElement("tr");
          row.className = "hover:bg-slate-700/30 transition";
          row.innerHTML = `
            <td class="py-3 px-4 font-mono text-xs text-slate-400">${item.date || '-'}</td>
            <td class="py-3 px-4 font-semibold text-slate-200">${item.customer || '-'}</td>
            <td class="py-3 px-4">${item.item || '-'}</td>
            <td class="py-3 px-4 font-mono">${item.qty || '0'}</td>
            <td class="py-3 px-4 font-mono">${item.price || '0.00'} AZN</td>
            <td class="py-3 px-4">
              <span class="px-2 py-1 rounded text-xs font-semibold ${item.paymentType === 'Kart' ? 'bg-blue-900/60 text-blue-300 border border-blue-700/50' : 'bg-green-900/60 text-green-300 border border-green-700/50'}">
                ${item.paymentType || 'Nəğd'}
              </span>
            </td>
            <td class="py-3 px-4 font-bold font-mono text-slate-100">${item.total || '0.00'} AZN</td>
          `;
          tbody.appendChild(row);
        });

      } catch (error) {
        console.error("Detallı Xəta:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-8 text-red-400">
              <p class="font-semibold text-base mb-1">Məlumat almaq mümkün olmadı</p>
              <p class="text-xs text-slate-400">Səbəb: Apps Script-də "Execute as: Me" və "Who has access: Anyone" ayarlarını dəqiqləşdirin.</p>
            </td>
          </tr>`;
      }
    }

    document.addEventListener("DOMContentLoaded", fetchSheetData);
  </script>
</body>
</html>
